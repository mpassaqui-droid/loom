[package]
name = "loom-gui"
version = "0.1.0"
edition = "2021"
description = "LOOM in a native window (egui) — editor, step grid, transport, themed to Omarchy."

[dependencies]
loom-core = { path = "../loom-core" }
loom-audio = { path = "../loom-audio" }
loom-app = { path = "../loom-app" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
