[package]
name = "loom-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for loom-core — runs the exact same engine in the browser and on phones."

[lib]
crate-type = ["cdylib"]

[dependencies]
loom-core = { path = "../loom-core" }
# the native sequencer, without sound card or MIDI ports: `bake_json` (Max for Live device)
loom-audio = { path = "../loom-audio", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Build with:  wasm-pack build loom-wasm --target web
