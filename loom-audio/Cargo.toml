[package]
name = "loom-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LOOM native sound: synth voices + a sample-clock sequencer driven by loom-core, with live audio output (cpal) and offline WAV rendering."

[dependencies]
loom-core = { path = "../loom-core" }
# Live audio output (PipeWire/ALSA on Linux). Turn off with
# `--no-default-features` to build/test the pure DSP without a sound card.
cpal = { version = "0.18", optional = true }
# MIDI in/out (ALSA sequencer) for `| midi N` voices, clock sync and live keyboards.
midir = { version = "0.11", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3"] }

[target.'cfg(target_os = "macos")'.dependencies]
# priorité du fil MIDI (QoS « user interactive »)
libc = "0.2"

[features]
default = ["device", "embed"]
device = ["dep:cpal", "dep:midir"]
# les sons de base dans le binaire (7 Mo) ; le WASM du web s'en passe
embed = []
